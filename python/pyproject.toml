[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "cliff-sdk"
version = "0.0.3"
description = "Push signals into Cliff: the official Python SDK for the Cliff ingest protocol"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Cliff" }]
keywords = ["cliff", "signals", "ingest", "telemetry", "sensors"]
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
]

[project.urls]
Homepage = "https://github.com/cliff-hq/cliff-sdk"

[tool.hatch.build.targets.wheel]
packages = ["src/cliff_sdk"]
